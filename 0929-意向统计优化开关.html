<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投票二维码 · 意向统计优先</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font:16px "Microsoft YaHei",Arial,sans-serif;color:#606266}button,input,textarea{font:inherit}button{cursor:pointer}header{height:76px;background:white;display:flex;align-items:center;padding:0 24px;gap:24px;color:#303133}.logo{background:#4069cf;color:white;font-size:30px;padding:0 8px}header strong{font-size:21px;color:#171717}header small{font-size:16px}nav{margin-left:auto;word-spacing:26px}.tabs{padding:12px 14px;display:flex;gap:6px}.tabs span{background:white;border:1px solid #ddd;border-radius:4px;padding:10px 23px}.tabs .active{color:#416cec;border-color:#416cec}.search,.listing{margin:0 14px 14px;background:white;padding:24px}.search input{width:570px}.primary{background:#406bec;border:1px solid #406bec;color:white;border-radius:4px;height:36px;padding:0 18px}input,textarea{border:1px solid #dcdfe6;border-radius:4px;padding:8px 16px;color:#606266;background:white;outline:none}input:focus,textarea:focus{border-color:#6485ff}input{height:38px}.search button{margin-left:14px}table{margin-top:18px;border-collapse:collapse;width:100%;font-size:16px}th,td{border:1px solid #ebeef5;text-align:left;padding:14px 12px;font-weight:400}th{background:#f5f7fa}td{height:91px}td:last-child{width:245px;line-height:2.5;text-align:center}.link{border:0;background:none;color:#406bec;font-size:14px;padding:0 5px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:flex-start;justify-content:center;padding:15vh 16px 24px;overflow:auto}.overlay[hidden]{display:none}.modal{width:346px;max-width:100%;background:white;border-radius:5px;box-shadow:0 1px 5px #0002;overflow:hidden}.modal-header{padding:20px 23px 14px;border-bottom:1px solid #dfe2e9;display:flex;align-items:center;justify-content:space-between;font-size:20px;color:#454545}.close{border:0;background:none;color:#a5a9b1;font-size:25px;line-height:24px;padding:0}.form-body{padding:37px 23px 54px}.row{display:flex;align-items:center;gap:12px;margin-bottom:28px;white-space:nowrap}.required:before{content:'*';color:#f56c6c;margin-right:5px}.radio{display:flex;align-items:center;gap:6px;cursor:pointer}.radio input{width:16px;height:16px;accent-color:#406bec;margin:0}.radio:has(input:checked){color:#406bec}.optimization{justify-content:space-between}.switch{width:40px;height:22px;background:#c0c4cc;border:0;border-radius:20px;padding:2px;transition:background .18s;position:relative}.switch:after{content:'';display:block;width:18px;height:18px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:transform .18s}.switch[aria-checked=true]{background:#406bec}.switch[aria-checked=true]:after{transform:translateX(18px)}.switch:focus-visible{outline:2px solid #406bec;outline-offset:3px}.field{display:block;margin-top:28px}.field>span{display:block;margin-bottom:8px}.field input,.field textarea{width:100%}.textarea-wrap{position:relative}.field textarea{height:125px;resize:vertical;padding-bottom:30px}.count{position:absolute;bottom:17px;right:12px;font-size:13px;color:#909399}.modal-footer{border-top:1px solid #dfe2e9;padding:11px}.modal-footer button{width:100%}.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);background:white;box-shadow:0 3px 14px #0002;padding:14px 24px;border-radius:4px;color:#606266;z-index:5}.toast[hidden]{display:none}@media(max-width:700px){header small,nav{display:none}header strong{font-size:16px}.search input{width:60%}.listing{overflow:auto}table{min-width:1000px}.overlay{padding-top:8vh}.form-body{padding-top:28px;padding-bottom:35px}}
</style></head><body>
<header><span class="logo">▮</span><strong>成都住建线上房产超市管理平台</strong><small>成都市住房和城乡建设局　⌄</small><nav>项目⌄　申请⌄　运营⌄　统计⌄　政务⌄　管理⌄　系统⌄</nav></header>
<div class="tabs"><span>选择企业</span><span>项目管理</span><span>政策管理</span><span>政策解读</span><span class="active">城市专场 ×</span></div>
<div class="search"><input placeholder="请输入活动名称"><button class="primary" id="search">查询</button><button id="reset">重置</button></div>
<div class="listing"><button class="primary">新增城市专场</button> <button class="primary">宣传配置</button><table><thead><tr><th>活动城市</th><th>活动名称</th><th>活动时间</th><th>活动状态</th><th>创建时间</th><th>是否展示</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><div class="modal-header"><span id="title">投票二维码</span><button class="close" aria-label="关闭">×</button></div><form id="form"><div class="form-body"><div class="row"><span class="required">是否需要意向统计</span><label class="radio"><input type="radio" name="intent" value="yes" checked>是</label><label class="radio" style="margin-left:18px"><input type="radio" name="intent" value="no">否</label></div><div class="row optimization"><span id="optimization-label">意向统计优先开关</span><button type="button" class="switch" role="switch" aria-checked="true" aria-labelledby="optimization-label" id="optimization"></button></div><label class="field"><span class="required">投票数量</span><input name="votes" type="number" min="1" step="1" value="3" required></label><label class="field"><span>结束时间</span><input name="endTime" type="datetime-local" step="1" aria-label="结束时间"></label><label class="field"><span class="required">内容通知</span><div class="textarea-wrap"><textarea name="notice" maxlength="500" required>123</textarea><span class="count">3/500</span></div></label></div><div class="modal-footer"><button class="primary" type="submit">生成二维码</button></div></form></section></div><div class="toast" role="status" hidden></div>
<script>
const rows=document.querySelector('#rows');const names=['未开始','121312','123123','无权限人员测试二维码','不可重复使用二维码测试','不可重复使用二维码测试','甘孜'];
names.forEach((name,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${i<3?'拉萨1':i===3?'上海站':'北京'}</td><td>${name}</td><td>2026-09-01 00:00:00 ~ 2026-09-25 00:00:00</td><td>${i<3?'未开始':'已开展'}</td><td>2026-09-22 10:46:18</td><td>是</td><td><button class="link">取消展示</button><button class="link">编辑</button><button class="link">签到二维码</button><br><button class="link open">投票二维码</button><button class="link">团购二维码</button></td>`;rows.append(tr)});
const overlay=document.querySelector('#overlay'),toggle=document.querySelector('#optimization');toggle.onclick=()=>toggle.setAttribute('aria-checked',String(toggle.getAttribute('aria-checked')!=='true'));document.querySelector('.close').onclick=()=>overlay.hidden=true;document.querySelectorAll('.open').forEach(b=>b.onclick=()=>{overlay.hidden=false;toggle.focus()});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.hidden=true});document.querySelector('textarea').oninput=e=>document.querySelector('.count').textContent=e.target.value.length+'/500';document.querySelector('#form').onsubmit=e=>{e.preventDefault();const toast=document.querySelector('.toast');toast.textContent='原型演示：配置已确认，二维码生成需接入服务';toast.hidden=false;setTimeout(()=>toast.hidden=true,3000)};document.querySelector('#search').onclick=()=>{const q=document.querySelector('.search input').value.trim();[...rows.children].forEach(r=>r.hidden=!r.children[1].textContent.includes(q))};document.querySelector('#reset').onclick=()=>{document.querySelector('.search input').value='';document.querySelector('#search').click()};
</script></body></html>
