297,"y":2530,"w":226,"h":136,"rules":["普通回复建议 50–150 字，长内容由详情页承载。","正文不足或事实核验失败时只展示受限说明和已核实信息。","最多 3 个通过验证的推荐问题，不凑数；界面卡片和路径由系统组装。"]},{"id":"INONE","title":"候选均未通过","description":"隐藏推荐区，保留当前内容和用户输入框","type":"system","x":578,"y":2530,"w":226,"h":136},{"id":"IA","title":"任一 AI 节点异常","description":"核心生成失败进入重试；可选追问失败保留已成功内容","type":"system","x":16,"y":1675,"w":226,"h":136},{"id":"IE2","title":"AI 失败提示与重试","description":"安安暂时开小差了，请稍后再试。","type":"error","x":16,"y":1870,"w":226,"h":136},{"id":"IRETRY","title":"重试失败节点","description":"保留对象、问题及资料，不创建重复会话","type":"system","x":16,"y":2070,"w":226,"h":136},{"id":"ISKIP","title":"可选追问失败：保留解读","description":"隐藏推荐问题，继续显示已成功的内容","type":"system","x":16,"y":2530,"w":226,"h":136},{"id":"IC","title":"用户继续追问或查看详情","description":"“有哪些注意事项？”沿用对象；新名称则重新匹配","type":"user","x":297,"y":2750,"w":226,"h":108},{"id":"IB","title":"进入政策原文或详情","description":"使用业务系统提供的真实路径","type":"system","x":578,"y":2750,"w":226,"h":136},{"id":"IM","title":"保存并恢复当前会话","description":"对象、问题、回答、卡片、追问及滚动位置；1 天内恢复","type":"system","x":578,"y":2960,"w":226,"h":136},{"id":"INEXT","title":"下一轮：重新识别意图","description":"携带对象与上下文，仅覆盖用户明确修改的信息","type":"system","x":297,"y":2960,"w":226,"h":164,"jump":"I01"}],"edges":[{"from":"I00","to":"I01"},{"from":"I01","to":"I02","label":"本流程意图","lx":410,"ly":390},{"from":"I01","to":"IG","a":"left","b":"right","label":"未识别","lx":269,"ly":250},{"from":"I01","to":"IR","a":"right","b":"left","label":"其他已识别意图","lx":638,"ly":185},{"from":"I02","to":"IRES"},{"from":"IRES","to":"ID1"},{"from":"IRES","to":"IMATCHERR","a":"right","b":"left","label":"异常","lx":550,"ly":673},{"from":"IMATCHERR","to":"IRES","a":"bottom","b":"right","via":[[691,773],[552,773],[552,730]],"dashed":true,"label":"重试匹配","lx":553,"ly":750},{"from":"ID1","to":"I03","a":"left","b":"right","label":"缺信息 / 重名","lx":270,"ly":815},{"from":"I03","to":"IU1"},{"from":"IU1","to":"I02","a":"left","b":"left","via":[[5,1094],[5,392],[272,392],[272,497]],"dashed":true,"label":"补充后重新匹配","lx":130,"ly":392},{"from":"ID1","to":"INF","a":"right","b":"left","label":"零匹配","lx":550,"ly":860},{"from":"ID1","to":"IQ","label":"唯一对象","lx":410,"ly":997},{"from":"IQ","to":"IE1","a":"right","b":"left","label":"异常","lx":550,"ly":1086},{"from":"IE1","to":"IQ","a":"bottom","b":"right","via":[[691,1210],[552,1210],[552,1150]],"dashed":true,"label":"重试","lx":659,"ly":1210},{"from":"IQ","to":"ISOURCE"},{"from":"ISOURCE","to":"ID2"},{"from":"ID2","to":"I04","label":"支持","lx":410,"ly":1625},{"from":"ID2","to":"ILIMIT","a":"right","b":"top","via":[[691,1510]],"label":"不足","lx":691,"ly":1625},{"from":"I04","to":"ICHECK"},{"from":"ICHECK","to":"I05","label":"通过","lx":410,"ly":2075},{"from":"ICHECK","to":"IREJECT","a":"right","b":"left","label":"不通过","lx":550,"ly":1945},{"from":"IREJECT","to":"ILIMIT","a":"top","b":"bottom"},{"from":"ILIMIT","to":"I05","a":"right","b":"right","via":[[816,1768],[816,2202]],"label":"受限说明后继续","lx":691,"ly":2080},{"from":"I05","to":"IV"},{"from":"IV","to":"IS","label":"有效候选","lx":410,"ly":2501},{"from":"IV","to":"INONE","a":"right","b":"top","via":[[691,2398]],"label":"全部未通过","lx":691,"ly":2500},{"from":"INONE","to":"IS","a":"bottom","b":"right","via":[[691,2700],[548,2700],[548,2630]]},{"from":"IA","to":"IE2","label":"核心节点失败","lx":129,"ly":1848},{"from":"IE2","to":"IRETRY"},{"from":"IA","to":"ISKIP","a":"left","b":"left","via":[[5,1743],[5,2598]],"dashed":true,"label":"追问生成失败","lx":129,"ly":2485},{"from":"ISKIP","to":"IS","a":"right","b":"left"},{"from":"IS","to":"IC"},{"from":"IC","to":"INEXT","label":"继续提问","lx":410,"ly":2916},{"from":"IC","to":"IB","a":"right","b":"left","label":"查看详情","lx":550,"ly":2730},{"from":"IB","to":"IM"},{"from":"IM","to":"IC","a":"right","b":"right","via":[[816,3028],[816,2910],[548,2910],[548,2830]],"dashed":true,"label":"1 天内返回","lx":715,"ly":2910}]};const DOCS=[{"id":"I01","title":"政策解读意图识别","file":"docs/interpret/I01-intent.md","summary":"识别对具体政策的解释需求；查找政策进入查政策流程，未识别时系统固定引导。","inputs":["本轮问题","所选政策与有效上下文","四类意图定义"],"outputs":["业务意图","是否需要澄清","系统路由建议"],"rules":["不回答政策事实","解读意图不代表有资格判断能力","引导文案由系统固定返回"],"content":"# I01 · 政策解读意图识别\n\n> 建议输出契约，复用共用 H01 四类意图定义，示例不包含真实政策结论。\n\n## 职责与触发\n\n用户希望理解具体政策、条款或已选政策的条件时识别为 `POLICY_INTERPRET`。询问“有哪些政策”属于 `POLICY_QUERY`。找房与咨询具体项目分别为 `FIND_HOUSE` 和 `PROJECT_QUERY`。\n\n## 输入\n\n当前问题、必要历史上下文、当前政策选择、有效政策引用。完整语义规则见 [共用意图识别 Prompt](../house/H01-intent.md)。\n\n## AI 输出 JSON 示例\n\n用户在选定政策后问“这项政策需要满足什么条件？”：\n\n```json\n{\n  \"node_id\": \"I01\",\n  \"intent\": \"POLICY_INTERPRET\",\n  \"multi_intent\": false,\n  \"need_clarification\": false,\n  \"next_node\": \"I02\"\n}\n```\n\n## 字段、路由与约束\n\n- `intent` 只能为四类意图之一或 `null`；本流程进入 I02。\n- 多个独立业务目标遵循共用 Prompt 主、次意图规则，由系统安排后续路由。\n- 问“我符合条件吗”可以识别为政策解读，但不表示系统具备个人资格认定能力，后续不作资格承诺。\n- 意图识别不回答补贴金额、申请标准或政策事实。\n- “解读一项政策”已明确业务，只是未指定对象，进入 I02/I03。\n\n## 未识别意图：系统固定引导\n\n结合有效上下文仍未识别到意图时，`intent` 返回 `null`，由系统 IG 原样返回以下文案，不调用 AI 生成、改写或补充：\n\n> 安安是你的购房小助手，我可以帮你找成都新房，以及查询成都购房支持政策。你可以告诉我想买哪个区域、预算多少，或者想了解哪类购房支持政策。\n\n## 失败处理与验收\n\n- 结构无效或 AI 服务失败走 IE2，不当作意图未识别。\n- “成都有哪些购房补贴” → POLICY_QUERY，进入查政策流程。\n- “刚才第一条的申请条件” → POLICY_INTERPRET，保留候选引用后解析。\n- “这个怎么样”且无上下文 → null，系统固定引导。\n\n## 依据\n\nH01 四类意图定义；需求 §2.4.1、§2.4.3；本次新增独立政策解读流程与固定引导要求。\n"},{"id":"I02","title":"政策对象与解读问题提取","file":"docs/interpret/I02-target.md","summary":"提取政策名称、区域或版本线索与关注点，系统解析真实政策对象。","inputs":["当前问题","已选政策及原卡片顺序","政策名称、区域、版本线索"],"outputs":["对象线索及已知引用","解读关注点","歧义和对象切换标志"],"rules":["不擅自选相似政策","粘贴片段不当作完整原文","以业务库确认政策身份"],"content":"# I02 · 政策对象与解读问题提取\n\n> 建议输出契约。示例政策引用为演示数据。\n\n## 职责与触发\n\n已识别政策解读意图后，提取指定政策、区域、版本线索、上下文指代与解读关注点。系统 IRES 负责匹配真实政策 ID，不能凭相近标题自动选中政策。\n\n## 输入\n\n- 用户原文、上轮政策卡片顺序与有效引用、已选择政策。\n- 系统提供的政策字典能力与版本信息；用户本轮明确的名称、区域、时间。\n\n## AI 输出 JSON 示例\n\n```json\n{\n  \"node_id\": \"I02\",\n  \"target\": {\n    \"provided_policy_ref\": \"demo-policy-a\",\n    \"name_text\": null,\n    \"region_text\": null,\n    \"version_text\": null,\n    \"reference_basis\": \"selected_policy_card\"\n  },\n  \"focus\": [\"application_conditions\"],\n  \"original_question\": \"这项政策的申请条件是什么？\",\n  \"target_changed\": false,\n  \"unresolved\": [],\n  \"next_node\": \"IRES\"\n}\n```\n\n## 字段说明与约束\n\n- `provided_policy_ref` 仅引用业务系统已提供 ID；名称、区域、版本来自用户原文或可追溯上下文。\n- “第一个政策”依据已展示卡片顺序解析，不能根据新排序重新绑定。\n- 关注点可为概况、适用对象、条件、有效期、流程等；只识别问题，不推断答案。\n- 用户粘贴片段可作为匹配线索，不自动当作完整有效政策原文；需业务库获取完整正文。\n- 唯一匹配进 IQ；多版本、重名或指代不明进 I03；真实零匹配进 INF；对象匹配接口异常进 IMATCHERR，重试匹配。详情接口异常进 IE1，重试详情获取。\n\n## 失败处理与验收\n\nAI 故障不覆盖已确认政策。两区政策同名时需确认区域；用户明确指定历史版本时保留版本；旧政策被删除时重新查库，不引用缓存得出当前结论。\n\n## 依据\n\n需求 §2.4.3 政策查询条件、时间与政策准确性；§2.4.4 会话保持。对象及版本消歧为独立解读流程的建议补充。\n"},{"id":"I03","title":"政策对象确认追问","file":"docs/interpret/I03-clarify.md","summary":"对象不明确或同名多版本时，只问必要信息，使用真实候选确认。","inputs":["政策匹配歧义","系统真实候选","原问题与关注点"],"outputs":["简短确认问题","真实候选引用","待确认对象字段"],"rules":["未确认对象不解读","不预设资格或金额","补充后重新匹配"],"content":"# I03 · 政策对象确认追问\n\n> 建议输出契约。业务意图已经明确，当前仅确认政策对象。\n\n## 职责与触发\n\n系统不能唯一确认政策时，询问名称、区域、版本或请用户从真实候选中选择。一次只问完成匹配所必需的信息。\n\n## 输入\n\n当前解读问题、已知政策线索、系统匹配候选、歧义原因及已有上下文。\n\n## AI 输出 JSON 示例\n\n```json\n{\n  \"node_id\": \"I03\",\n  \"question\": \"你想了解哪项政策？可以告诉我政策名称，或选择已经查到的政策卡片。\",\n  \"candidate_refs\": [],\n  \"awaiting\": \"policy_target\",\n  \"preserve_focus\": [\"overview\"],\n  \"next_node\": \"IU1\"\n}\n```\n\n## 字段说明与约束\n\n- `candidate_refs` 只能来自 IRES 真实查询；名称、区域、时效等字段由系统渲染，AI 不创建候选政策。\n- `question` 不预设补贴金额、资格、申请条件；未确认对象前不启动正文解读。\n- 多版本需说明可核验的区分点，不能默认为最新版本后忽略用户原问。\n- 保留原解读关注点，用户补充后回 I02/IRES；已知名称但零匹配使用 INF 固定提示。\n\n## 失败处理与验收\n\nAI 失败走 IE2；无对象时不输出政策结论；区域已确认则不重复问区域；用户选定后只解读该政策，不能拿另一政策替代。\n\n## 依据\n\n需求 §2.4.3 政策查询条件与准确性、§2.4.4 上下文保持。对象确认是本次细化建议。\n"},{"id":"I04","title":"基于完整政策原文解读","file":"docs/interpret/I04-explain.md","summary":"有完整正文才生成结论、注意事项和原文入口；每条事实绑定正文依据。","inputs":["已确认政策与系统时效状态","完整正文及段落引用","解读问题和真实原文路径"],"outputs":["忠实的正文概括","注意事项与段落依据","原文入口及未评定资格标志"],"rules":["缺正文走系统受限说明","不从常识补全条件或金额","不作个体资格和补贴承诺"],"content":"# I04 · 基于完整政策原文解读\n\n> 建议输出契约，沿用 P05 的事实与资格边界。以下输入与输出为虚构测试数据，不代表任何真实政策。\n\n## 职责与触发\n\n系统已确认唯一政策、核验时效与来源，并取得完整可读正文后，按“结论 + 注意事项 + 原文入口”组织简短解读。结论指正文摘要，不代表用户个人资格或权利认定。\n\n## 输入\n\n- 已确认政策 ID、标题、标签、发布时间、有效期、系统计算的生效状态。\n- 完整原文及可核验段落引用、发布机构、真实原文或详情路径引用。\n- 用户当前问题、解读关注点；不以用户自述代替资格审核。\n\n## AI 输出 JSON 示例\n\n演示全文仅为两句：“本测试文件用于说明政策信息查询流程。”“阅读政策信息时应核对文件标注的有效期。”\n\n```json\n{\n  \"node_id\": \"I04\",\n  \"policy_ref\": \"demo-policy-a\",\n  \"mode\": \"body_summary\",\n  \"status_ref\": \"demo-system-status\",\n  \"conclusion\": \"示意政策 A 是说明政策信息查询流程的测试文件。\",\n  \"notes\": [\"阅读时应核对文件标注的有效期。\"],\n  \"claims\": [\n    {\"text\": \"说明政策信息查询流程\", \"section_refs\": [\"demo-section-01\"]},\n    {\"text\": \"核对文件标注的有效期\", \"section_refs\": [\"demo-section-02\"]}\n  ],\n  \"source_route_ref\": \"demo-original-route\",\n  \"individual_eligibility\": \"not_assessed\",\n  \"next_node\": \"ICHECK\"\n}\n```\n\n## 字段说明\n\n| 字段 | 说明 |\n| --- | --- |\n| `mode` | 仅 body_summary，前置条件为完整正文。 |\n| `status_ref` | 引用系统计算的时效状态，模型不自行改写状态。 |\n| `conclusion` / `notes` | 必须由正文直接支持，不加入推测的标准或条件。 |\n| `claims` | 每条事实绑定当前原文段落，供 ICHECK 核验。 |\n| `source_route_ref` | 原文或详情路径的真实引用，不让模型拼接链接。 |\n| `individual_eligibility` | 固定 not_assessed，不承诺用户能领取补贴。 |\n\n## 约束与系统衔接\n\n- 无正文或仅有片段：不调用 I04，由 ILIMIT 固定说明“当前可以查询到该政策，但具体补贴标准和申请条件需要进入政策详情查看。”\n- 有正文但未提及用户所问条件时，明确原文未说明，保留原文入口；不从其他政策或常识补全。\n- 原文明确的对象、日期、金额、条件和限制必须完整保留，不省略限制后得出夸大结论。\n- 已失效与尚未生效的政策明确标识；历史解读不能描述为当前执行。\n- 不回答学区归属，不作审核结果、个人资格或收益承诺。\n- 原文内部矛盾或时效冲突需待核验，不自行裁决；无有效原文入口不编造链接。\n- 普通回复建议 50–150 字；原文细节通过详情页承载。输出必须经 ICHECK 校验，通过后进入 I05；失败转 IREJECT/ILIMIT。\n\n## 失败处理与验收\n\n正文接口失败走 IE1，区别于成功读取但无正文。AI 服务错误走 IE2。无依据断言被拦截并转受限说明。测试“只有标题、没有正文”不得调用 I04；问“我一定能拿到吗”不承诺；原文没有材料清单时不生成材料清单。\n\n## 可复用提示词与依据\n\n只归纳当前完整正文。所有结论和注意事项都应有段落依据，保留生效状态及适用限制，不补造标准，不评定个人资格。输出供系统核验的 JSON。\n\n依据：需求 §2.4.3 政策解读、准确性与时效；§2.4.5—2.4.7；本次独立政策解读流程要求。\n"},{"id":"I05","title":"政策解读后推荐追问","file":"docs/interpret/I05-followups.md","summary":"依据当前原文与真实入口生成待验证追问，资料不足时避免诱导虚构解读。","inputs":["已解读内容","原文可用性和段落索引","支持的查询与真实业务入口"],"outputs":["候选问题","所需原文及对象引用","待系统验证状态"],"rules":["最多展示 3 个验证通过的问题","无正文不推荐额度和条件解读","追问失败保留已成功内容"],"content":"# I05 · 政策解读后推荐追问\n\n> 建议输出契约；示例为虚构测试引用。推荐最多 3 个，先验证后展示。\n\n## 职责与触发\n\nICHECK 校验通过或 ILIMIT 返回固定受限说明后，依据政策正文可用性及真实操作入口提出下一步候选。不因用户已进入解读流程就假定存在正文。\n\n## 输入\n\n当前政策、用户问题、已解读内容、完整正文可用性与段落索引、有效原文/详情路径、系统可支持查询能力。\n\n## AI 输出 JSON 示例\n\n测试正文只有政策信息阅读注意事项时：\n\n```json\n{\n  \"node_id\": \"I05\",\n  \"candidate_questions\": [\n    {\n      \"question\": \"这项政策信息还有哪些阅读注意事项？\",\n      \"policy_ref\": \"demo-policy-a\",\n      \"requires_full_body\": true,\n      \"supporting_sections\": [\"demo-section-02\"],\n      \"verification_state\": \"pending_system_query\"\n    }\n  ],\n  \"next_node\": \"IV\"\n}\n```\n\n## 字段说明与约束\n\n- `candidate_questions` 可为空，不凑数；不重复当前已回答问题。\n- `supporting_sections` 必须引用真实正文，IV 再次核验正文是否支持该追问。\n- 缺正文时不推荐额度、条件或资格解读，只保留真实详情入口或可查询到数据的查政策操作。\n- 原文未记载申请材料、途径、金额时，不生成相关问题诱导用户期待不存在的答案。\n- 用户点击后进入 I01/I02 并继承政策引用；改问其他政策或业务时重新匹配、重新路由。\n- 验证接口失败或零通过时隐藏推荐问题，保留本轮解读；新问题提交时重新获取需要的实时信息。\n\n## 失败处理与验收\n\n推荐生成失败不能清空已成功的政策解读。只有两条通过就显示两条；缺正文不能推荐申请标准解读；详情路径失效时隐藏入口，不拼接假链接。原文页面 1 天内返回，恢复政策对象、解读、卡片、追问和滚动位置。\n\n## 依据\n\n需求 §2.4.1 后续问题、§2.4.3 政策真实数据与零结果原则、§2.4.4—2.4.7；本次独立解读流程补充。\n"}];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = Object.fromEntries(FLOW.nodes.map(n=>[n.id,n]));
const specs = Object.fromEntries(DOCS.map(n=>[n.id,n]));
const labels = {ai:'✦ AI 输出',system:'系统处理',user:'用户操作',decision:'◇ 条件判断',error:'异常处理'};
let zoom = 1;
let selected = FLOW.defaultNode;
function point(n,side){return side==='left'?[n.x,n.y+n.h/2]:side==='right'?[n.x+n.w,n.y+n.h/2]:side==='top'?[n.x+n.w/2,n.y]:[n.x+n.w/2,n.y+n.h];}
function edgeMarkup(edge){
 const a=point(byId[edge.from],edge.a||'bottom'),b=point(byId[edge.to],edge.b||'top');
 const points=[a,...(edge.via||[]),b].map(p=>p.join(',')).join(' ');
 let label='';
 if(edge.label){const w=edge.label.length*10+14;label=`<g><rect x="${edge.lx-w/2}" y="${edge.ly-8}" width="${w}" height="17" rx="4" fill="#f7f8fb"/><text class="edge-label" x="${edge.lx}" y="${edge.ly+4}" text-anchor="middle">${esc(edge.label)}</text></g>`;}
 return `<polyline class="edge ${edge.dashed?'dashed':''}" points="${points}"/>${label}`;
}
function renderGraph(){
 $('#diagram').style.height=FLOW.height+'px';
 $('#diagram').innerHTML=`<svg class="edges" width="830" height="${FLOW.height}" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8c2d2"/></marker></defs>${FLOW.edges.map(edgeMarkup).join('')}</svg>`+
 FLOW.phases.map((p,i)=>`<div class="phase-band" style="top:${p.y}px"><b>0${i+1}</b>${esc(p.title)}</div>`).join('')+
 FLOW.nodes.map(n=>`<article class="node ${n.type}" id="node-${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px" aria-label="${n.id} ${esc(n.title)}"><button class="node-main" data-select="${n.id}" aria-pressed="false"><div class="node-head"><span class="node-type">${labels[n.type]}</span><span class="node-id">${n.id}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.description)}</p></button>${n.type==='ai'?`<div class="node-footer"><a href="${encodeURI(specs[n.id].file)}" target="_blank" rel="noopener" aria-label="${esc(n.title)}：打开 Markdown 文档">输出说明 .md ↗</a><span>可下载</span></div>`:''}${n.link?`<a class="node-go" href="${encodeURI(n.link)}">查看对应流程 →</a>`:''}${n.jump?`<button class="node-go node-go-button" data-jump="${n.jump}">↻ 回到 ${n.jump} 意图识别</button>`:''}</article>`).join('');
 document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('click',()=>selectNode(el.dataset.select,true)));
 FLOW.nodes.forEach(n=>{
  if(n.links){const links=document.createElement('div');links.className='node-links';links.innerHTML=n.links.map(link=>`<a href="${encodeURI(link.file)}">${esc(link.label)}</a>`).join('');$('#node-'+n.id).appendChild(links);}
  if(n.jumpLabel)$('#node-'+n.id+' [data-jump]').textContent='↻ '+n.jumpLabel;
 });
 document.querySelectorAll('[data-jump]').forEach(el=>el.addEventListener('click',()=>{selectNode(el.dataset.jump);$('#viewport').scrollTo({top:(byId[el.dataset.jump].y-35)*zoom,behavior:'smooth'});}));
 $('#phases').innerHTML=FLOW.phases.map((p,i)=>`<button class="phase-nav" data-phase="${i}"><span class="phase-index">0${i+1}</span><span><strong>${esc(p.title)}</strong><small>${esc(p.sub)}</small></span></button>`).join('');
 document.querySelectorAll('[data-phase]').forEach(el=>el.addEventListener('click',()=>$('#viewport').scrollTo({top:FLOW.phases[+el.dataset.phase].y*zoom,behavior:'smooth'})));
}
function selectNode(id,open=false){
 const n=byId[id];if(!n)return;selected=id;
 document.querySelectorAll('.node').forEach(el=>{const active=el.id==='node-'+id;el.classList.toggle('selected',active);el.querySelector('button').setAttribute('aria-pressed',String(active));});
 const d=specs[id];
 const section=(name,values)=>`<section class="detail-section"><h3>${name}</h3><ul>${values.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;
 const next=n.fixedReply?['等待用户继续提问，再重新识别业务意图。']:FLOW.edges.filter(e=>e.from===id).map(e=>`${e.label?e.label+' → ':''}${byId[e.to].title}`);
 $('#detail').innerHTML=`<div class="detail-kicker">${esc(id)} / ${labels[n.type]}</div><h2>${esc(n.title)}</h2><p class="detail-summary">${esc(d?d.summary:n.description)}</p>`+(d?`<button class="doc-primary" data-read="${id}"><span>阅读 AI 输出说明<small>输入 · 输出示例 · 约束 · 验收</small></span><span>↗</span></button><div class="doc-links"><a href="${encodeURI(d.file)}" target="_blank" rel="noopener">打开 .md 原文件 ↗</a><a href="${encodeURI(d.file)}" download>下载 Markdown ↓</a></div>${section('节点输入',d.inputs)}${section('AI 需要输出',d.outputs)}${section('关键约束',d.rules)}`:`${section('处理规则',systemRules(n))}${section('后续流向',next.length?next:['使用当前上下文返回对应节点继续'])}`)+`<div class="detail-boundary">依据需求文档 §${FLOW.source}<br>${d?'字段名与 JSON 结构为建议输出契约，供研发评审。':'业务规则由系统执行；此页面用于流程评审。'}</div>`;
 if(d)$('#detail [data-read]').addEventListener('click',()=>openDoc(id));
 if(open&&innerWidth<=800)$('#inspector').classList.add('open');
}
function systemRules(n){
 if(n.fixedReply)return ['结合有效上下文后仍未识别到业务意图时，统一进入本分支。','系统原样返回上方固定引导，不调用 AI 生成、改写或补充文案。','本轮不进入楼盘或政策查询，保留会话并等待用户继续提问。'];
 if(n.rules)return n.rules;
 const rules={
 H00:['发送后显示“安安正在帮你找……”；成功后替换为结果。','开场语由管理端配置；引导问题默认随机展示 3 个。'],
 P00:['发送后显示 AI 回复中状态；成功后替换为结果。','开场语和推荐引导问题由管理端配置。'],
 HD2:['按已支持字段判断能否形成可执行查询，不将所有筛选项设为必填。','具体楼盘可直接查询；“帮我找房”需要补问。预算模糊范围由配置或追问确定。'],
 HS1:['确认字段能力并查询实际价格分布，再交给 AI 转换。','缺少地图、点位或标签依据时，保留未解析项并追问，不虚构通勤时间。'],
 HQ:['接口负责条件校验、过滤与排序，硬性条件优先。','自然结果不按运营推广顺序重排；如有商业推广需单独标识。','页面和顾问路径来自真实项目 ID 与已配置路由。'],
 HS:['最多展示 5 个项目；优先硬性条件、预算、区域、产品、面积户型、在售及可售情况。','零结果时不展示楼盘卡片，仅展示说明及通过验证的问题。','推荐问题校验全部失败时隐藏问题区，允许手动继续输入。'],
 HV:['对候选条件实际查库，去重、过滤无结果候选，最多保留 3 个。','优先保留区域调预算，其次保留预算换区域，再扩大区域，最后放宽全部限制。','放宽候选不改写原条件，用户点击后才发起下一轮。'],
 PT:['系统根据当前日期与政策起止时间判断已生效 / 即将生效 / 已失效。','发布时间不等于生效时间；时间缺失或口径不明时标为待核验。','“当前”展示有效政策；“最新”按配置时间字段倒序，同时展示状态。'],
 PN:['固定受限说明：“当前可以查询到该政策，但具体补贴标准和申请条件需要进入政策详情查看。”','展示真实详情入口，不生成无法从正文核实的政策内容。'],
 PS:['单次最多 5 条政策，卡片展示名称、标签、有效期、状态和真实详情入口。','零结果不展示政策卡片；推荐问题必须通过政策库校验。','概括普通回复建议 50–150 字；复杂政策信息由详情页承载。'],
 PV:['候选问题必须用政策库实际数据验证；最多显示 3 个。','解读类候选需要正文支持；无正文不诱导生成申请条件。','验证失败或无结果的候选不展示，保留手动提问入口。'],
 HM:['用户问题、AI 回答、业务卡片、推荐追问、当前条件、滚动位置一并保存。','进入详情或其他业务页后，1 天内返回恢复原会话。'],
 PM:['用户问题、AI 回答、业务卡片、推荐追问、当前条件、滚动位置一并保存。','进入详情或其他业务页后，1 天内返回恢复原会话。'],
 HE1:['展示“楼盘数据暂时没有查询成功，请稍后重试。”','保留当前条件，重试当前接口；查询错误不按无匹配数据处理。'],
 PE1:['展示“政策数据暂时没有查询成功，请稍后重试。”','保留当前条件，重试当前接口；查询错误不按无匹配数据处理。']
 };
 return rules[n.id]||[n.description,...(n.type==='error'?['保留本次输入、条件和历史结果；重试失败节点。']:[])];
}
function setZoom(value){zoom=Math.min(1.25,Math.max(.45,value));$('#diagram').style.transform=`scale(${zoom})`;$('#stage-wrap').style.width=830*zoom+'px';$('#stage-wrap').style.height=FLOW.height*zoom+'px';$('#zoom-value').value=Math.round(zoom*100)+'%';}
function fitWidth(){setZoom(innerWidth<=800?.9:Math.min(1,($('#viewport').clientWidth-26)/830));if(innerWidth<=800)$('#viewport').scrollLeft=Math.max(0,(830*zoom-$('#viewport').clientWidth)/2);}
function inlineMd(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function markdown(s){
 const lines=s.replace(/\r/g,'').split('\n');let out='',inCode=false,code=[],list=false;
 const endList=()=>{if(list){out+='</ul>';list=false;}};
 for(let i=0;i<lines.length;i++){
  const line=lines[i];
  if(line.startsWith('```')){endList();if(inCode){out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=[];inCode=false;}else inCode=true;continue;}
  if(inCode){code.push(line);continue;}
  if(!line.trim()){endList();continue;}
  const heading=line.match(/^(#{1,4})\s+(.+)$/);if(heading){endList();const level=heading[1].length;out+=`<h${level}>${inlineMd(heading[2])}</h${level}>`;continue;}
  if(line.trim().startsWith('|')&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|\s*$/.test(lines[i+1])){endList();const cells=t=>t.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());out+='<table><thead><tr>'+cells(line).map(v=>'<th>'+inlineMd(v)+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<lines.length&&lines[i].trim().startsWith('|')){out+='<tr>'+cells(lines[i]).map(v=>'<td>'+inlineMd(v)+'</td>').join('')+'</tr>';i++;}i--;out+='</tbody></table>';continue;}
  if(/^\s*[-*]\s/.test(line)||/^\d+[.)、]\s*/.test(line)){if(!list){out+='<ul>';list=true;}out+='<li>'+inlineMd(line.replace(/^\s*(?:[-*]|\d+[.)、])\s*/,''))+'</li>';continue;}
  endList();if(line.startsWith('>')){out+='<blockquote>'+inlineMd(line.replace(/^>\s*/,''))+'</blockquote>';continue;}
  if(/^---+$/.test(line.trim())){out+='<hr>';continue;}out+='<p>'+inlineMd(line)+'</p>';
 }
 endList();if(inCode)out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';return out;
}
function openDoc(id){const d=specs[id];if(!d)return;$('#modal-title').textContent=d.id+' · '+d.title;$('#modal-body').className='markdown';$('#modal-body').innerHTML=markdown(d.content);$('#modal-raw').href=d.file;$('#modal-raw').hidden=false;$('#modal-download').href=d.file;$('#modal-download').hidden=false;if(!$('#document-modal').open)$('#document-modal').showModal();$('#document-modal').scrollTop=0;}
function openIndex(){
 $('#modal-title').textContent=FLOW.title+' · AI 节点文档';$('#modal-body').className='doc-list';$('#modal-raw').hidden=true;$('#modal-download').href='docs/README.md';$('#modal-download').hidden=false;
 $('#modal-body').innerHTML='<div class="notice">每份文档包含触发条件、输入、AI 输出 JSON 示例、约束和验收要点。输出契约为评审建议稿；示例不代表真实楼盘或政策。</div>'+DOCS.map(d=>`<div class="doc-item"><span>${d.id}</span><button data-read="${d.id}">${esc(d.title)}</button><a href="${encodeURI(d.file)}" target="_blank" rel="noopener">.md ↗</a><a href="${encodeURI(d.file)}" download>下载 ↓</a></div>`).join('')+'<div class="detail-boundary"><a href="docs/README.md" target="_blank">打开总说明与文档索引 ↗</a> · <a href="docs/需求原文.md" target="_blank">查看需求原文 ↗</a></div>';
 $('#modal-body').querySelectorAll('[data-read]').forEach(el=>el.addEventListener('click',()=>openDoc(el.dataset.read)));$('#document-modal').showModal();
}
renderGraph();selectNode(selected);fitWidth();
$('#zoom-in').addEventListener('click',()=>setZoom(zoom+.1));$('#zoom-out').addEventListener('click',()=>setZoom(zoom-.1));$('#zoom-fit').addEventListener('click',fitWidth);
